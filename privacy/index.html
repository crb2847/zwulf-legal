<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privacy policies — Zwulf</title>
  <meta name="description" content="Privacy policies for every app published by Zwulf.">
  <meta name="theme-color" content="#0b0a0f">
  <link rel="canonical" href="https://zwulf.com/privacy/">
  <style>
    :root { color-scheme: dark; --ink: #0b0a0f; --ink-2: #13111a; --line: #2a2535;
            --bone: #f1ead9; --ash: #a39d8f; --ember: #ffa62b; --moss: #7fd6a8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 3rem 1.25rem 4rem; background: var(--ink); color: var(--bone);
           font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main, footer { max-width: 44rem; margin: 0 auto; }
    .hud { font: 0.78rem/1.4 ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
           letter-spacing: 0.12em; text-transform: uppercase; color: var(--ash); }
    .hud a { color: var(--ember); text-decoration: none; }
    h1 { font: 900 clamp(2.2rem, 8vw, 3.75rem)/0.95 "Arial Black", "Segoe UI Black", Impact, system-ui, sans-serif;
         letter-spacing: -0.04em; text-transform: uppercase; margin: 1.5rem 0 1rem; }
    p { color: var(--ash); max-width: 36rem; }
    ul { list-style: none; margin: 2.5rem 0 0; padding: 0; border-top: 1px solid var(--line); }
    li { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
         gap: 0.5rem 1rem; padding: 1.1rem 0; border-bottom: 1px solid var(--line); }
    li a { color: var(--bone); font-weight: 700; font-size: 1.15rem; text-decoration: none; }
    li a::after { content: " \2192"; color: var(--ember); }
    a:hover { color: var(--ember); }
    a:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
    code { font: 0.8rem ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; color: var(--ash); }
    footer { margin-top: 3rem; }
  </style>
</head>
<body>
  <main>
    <p class="hud"><a href="../">&larr; Zwulf</a> // Legal</p>
    <h1>Privacy policies</h1>
    <p>One policy per app. They all say the same thing in more words: no ads, no tracking, no mandatory accounts, and your data stays on your device.</p>
    <ul>
      <li><a href="../sudoku/privacy.html">Sudoku &amp; Dragons</a><code>com.zwulf.sudoku</code></li>
    </ul>
  </main>
  <footer class="hud">&copy; 2026 Zwulf LLC &middot; <a href="mailto:developer@zwulf.com">developer@zwulf.com</a></footer>
